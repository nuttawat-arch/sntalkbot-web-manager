<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ — SNTalkBot Web Manager</title><link rel="stylesheet" href="/static/style.css"></head><body>
<main id="main"><h1>SNTalkBot Web Manager</h1><h2>เข้าสู่ระบบ</h2>
{% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login">
<label for="username">ชื่อผู้ดูแล</label><input id="username" name="username" autocomplete="username" required>
<label for="password">รหัสผ่าน</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">เข้าสู่ระบบ</button>
</form><p>เวอร์ชัน {{ version }}</p></main></body></html>
